<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- MagnusOrgue logo: five organ pipes over a dark rounded tile -->
  <defs>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c469"/>
      <stop offset="0.55" stop-color="#c99a3a"/>
      <stop offset="1" stop-color="#8a6420"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1d22"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#c99a3a" stroke-opacity="0.35" stroke-width="3"/>

  <!-- pipes, tallest in the middle -->
  <g fill="url(#pipe)">
    <rect x="56"  y="96" width="22" height="104" rx="6"/>
    <rect x="90"  y="72" width="22" height="128" rx="6"/>
    <rect x="124" y="52" width="22" height="148" rx="6"/>
    <rect x="158" y="72" width="22" height="128" rx="6"/>
    <rect x="192" y="96" width="22" height="104" rx="6"/>
  </g>

  <!-- pipe mouths -->
  <g fill="#101014" fill-opacity="0.85">
    <ellipse cx="67"  cy="176" rx="7" ry="4.5"/>
    <ellipse cx="101" cy="168" rx="7" ry="4.5"/>
    <ellipse cx="135" cy="160" rx="7" ry="4.5"/>
    <ellipse cx="169" cy="168" rx="7" ry="4.5"/>
    <ellipse cx="203" cy="176" rx="7" ry="4.5"/>
  </g>

  <!-- keybed hint at the base -->
  <rect x="46" y="206" width="164" height="14" rx="4" fill="#e9e2d0"/>
  <g fill="#101014">
    <rect x="66"  y="206" width="7" height="9" rx="1.5"/>
    <rect x="88"  y="206" width="7" height="9" rx="1.5"/>
    <rect x="120" y="206" width="7" height="9" rx="1.5"/>
    <rect x="142" y="206" width="7" height="9" rx="1.5"/>
    <rect x="164" y="206" width="7" height="9" rx="1.5"/>
  </g>
</svg>
